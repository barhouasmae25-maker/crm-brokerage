services:

  db:
    image: postgres:15
    container_name: crm_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: crm_db

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data


  backend:
    build: ./backend
    container_name: crm_backend
    restart: always

    ports:
      - "5000:5000"

    depends_on:
      - db

    environment:
      PORT: 5000
      DB_URL: postgres://postgres:123@db:5432/crm_db
      JWT_SECRET: supersecret

    volumes:
      - ./database:/database
      - ./backend/uploads:/app/uploads


  frontend:
    build: ./frontend
    container_name: crm_frontend
    restart: always

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  pgdata: